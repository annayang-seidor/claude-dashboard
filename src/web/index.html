<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The page URL carries the dashboard token; never leak it via Referer. -->
    <meta name="referrer" content="no-referrer" />
    <!-- Fonts from Google Fonts (ADR 0020); system fonts take over when offline. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap"
    />
    <!-- Clawd Sparkles by Icons8 -->
    <link rel="icon" type="image/svg+xml" href="/clawd-sparkles.svg" />
    <title>Claude Code Session Dashboard</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
